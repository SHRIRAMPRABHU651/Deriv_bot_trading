# Non-secret configuration. Copy to config.yaml to override. Secrets live in .env only.
app:
  host: 127.0.0.1
  port: 8000
  db_path: data/derivbot.db
  log_dir: logs
  model_dir: model
  timezone: UTC            # day/week boundaries; weekly boundary = Monday 00:00 in this zone
  allowed_hosts: [127.0.0.1, localhost]
  allowed_origins: ["http://127.0.0.1:8000", "http://localhost:8000"]

deriv:
  rest_base_url: https://api.derivws.com      # UNCONFIRMED against live docs, see docs/API_NOTES.md
  requests_per_second: 5
  burst: 10
  ping_interval_s: 15
  ping_timeout_s: 10
  request_timeout_s: 10
  proposal_timeout_s: 5
  buy_timeout_s: 8
  settlement_timeout_s: 120   # beyond expiry, move to RECONCILIATION_PENDING

trading:
  symbols: [R_100]
  currency: USD
  # ---- Trade type (the four Options products in the Deriv app + classic Rise/Fall) ----------
  # A model is only valid for the exact terms it was trained on; changing any label-defining
  # value below without retraining makes the bot refuse the model (NO TRADING).
  product:
    product: multiplier        # multiplier | accumulator | turbo | vanilla | rise_fall
    horizon_ticks: 20          # N ticks: expiry (turbo/vanilla/rise_fall) or hold cap (multiplier/accumulator)
    tick_seconds: 2.0          # seconds per tick of the symbol (R_100 = 2, 1HZ100V = 1)
    hold_grace_s: 2.0          # extra seconds beyond horizon*tick_seconds before a hold-cap sell
    max_fee_pct: 0.05          # refuse if (ask - stake)/stake exceeds this (not used for rise_fall)
    tolerance: 0.10            # allowed deviation of the LIVE proposal vs the trained terms
    assumed_fee_pct: 0.0       # research only: fee as a fraction of stake
    duration_unit: t           # proposal duration unit for expiring products
    # multiplier: server-side take-profit / stop-loss, as a fraction of the stake (stop <= 1)
    multiplier: 20
    take_profit_pct: 0.5
    stop_loss_pct: 0.5
    # accumulator: growth per tick; barrier_pct = per-tick barrier as a fraction of spot
    growth_rate: 0.01
    barrier_pct: 0.0006
    # turbo: knock-out distance in PRICE units; bot sells at market once profit >= take_profit_pct*cost
    barrier_offset: 0.5
    # vanilla: held to expiry; strike offset (price units) and the terminal move that pays target_pct
    strike_offset: 0.0
    target_pct: 0.5
    needed_move: 1.0
    # rise_fall: research assumption only (the live bot uses the proposal payout)
    payout_ratio: 1.95
  min_stake: "0.35"
  stake_precision: 2
  max_signal_age_s: 2.0
  max_price_slippage_percent: "0"   # buy at most the proposal ask price
  execution_workers: 2
  tick_queue_size: 256
  signal_queue_size: 32

strategy:
  name: ml                     # ml | ema
  version: "1"
  ema_fast: 5
  ema_slow: 20

risk:
  balance_max_age_s: 60
  feed_stale_after_s: 10
  max_latency_ms: 2000          # 0 disables the latency halt
  latency_halt_enabled: false
  correlation_groups:
    volatility_indices: [R_10, R_25, R_50, R_75, R_100]
  demo:
    stake_percent: "0.01"
    stake_cap_percent: "0.01"
    daily_loss_percent: "0.03"
    weekly_loss_percent: "0.06"
    max_drawdown_percent: "0.10"
    max_consecutive_losses: 3
    max_trades_per_day: 200
    max_open_trades: 2
    max_open_trades_per_symbol: 1
    max_total_exposure_percent: "0.03"
    max_group_exposure_percent: "0.02"
    cooldown_seconds: 5
  live:
    stake_percent: "0.005"
    stake_cap_percent: "0.005"
    daily_loss_percent: "0.01"
    weekly_loss_percent: "0.03"
    max_drawdown_percent: "0.10"
    max_consecutive_losses: 3
    max_trades_per_day: 50
    max_open_trades: 1
    max_open_trades_per_symbol: 1
    max_total_exposure_percent: "0.01"
    max_group_exposure_percent: "0.01"
    cooldown_seconds: 10

ml:
  edge_margin: 0.03
  alpha: 0.05
  min_validation_trades: 300      # min out-of-sample trades before a model may be WALK_FORWARD_VALID
  min_demo_trades: 1000           # min demo trades before PROMOTABLE
  monitor_window: 100
  monitor_alpha: 0.05
  feature_version: v1

retention:
  ticks_days: 7
  latency_days: 30
  store_ticks: false
  cleanup_interval_s: 3600
