<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DERIVBOT</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header id="modebar" class="demo">
    <div class="brand">DERIVBOT</div>
    <div id="mode">MODE: DEMO</div>
    <div id="runstate">STOPPED</div>
    <div class="auth">
      <input id="token" type="password" placeholder="dashboard token" autocomplete="off">
      <button id="save-token">Set</button>
    </div>
  </header>

  <main>
    <section class="card wide" id="alerts"></section>

    <section class="card">
      <h2>Account</h2>
      <dl id="account"></dl>
    </section>
    <section class="card">
      <h2>P&amp;L / Risk</h2>
      <dl id="pnl"></dl>
    </section>
    <section class="card">
      <h2>Model / Edge</h2>
      <dl id="model"></dl>
    </section>
    <section class="card">
      <h2>Feed / Latency</h2>
      <dl id="feed"></dl>
    </section>

    <section class="card wide">
      <h2>Live ticks</h2>
      <select id="symbol"></select>
      <canvas id="chart" width="900" height="180"></canvas>
    </section>

    <section class="card wide controls">
      <h2>Controls</h2>
      <button id="btn-start">Start</button>
      <button id="btn-stop">Stop</button>
      <button id="btn-kill" class="danger">KILL SWITCH</button>
      <button id="btn-clear-kill">Clear kill…</button>
      <button id="btn-reload">Reload model</button>
      <button id="btn-live" class="danger">Switch to LIVE…</button>
      <button id="btn-demo">Switch to DEMO</button>
      <label class="inline">Trade type
        <select id="product">
          <option value="multiplier">Multipliers</option>
          <option value="accumulator">Accumulators</option>
          <option value="turbo">Turbos</option>
          <option value="vanilla">Vanillas</option>
          <option value="rise_fall">Rise / Fall</option>
        </select>
      </label>
      <button id="btn-product">Apply (bot must be stopped)</button>
      <span id="msg"></span>
    </section>

    <section class="card wide"><h2>Recent trades</h2><table id="trades"></table></section>
    <section class="card wide"><h2>Recent signals</h2><table id="signals"></table></section>
    <section class="card wide"><h2>Recent risk events</h2><table id="events"></table></section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-body">
      <h2>Switch DEMO → LIVE</h2>
      <p class="warn">You are about to trade with REAL MONEY. Profitability is not guaranteed.</p>
      <dl id="live-summary"></dl>
      <label>Type <b>LIVE</b> to continue: <input id="live-typed" autocomplete="off"></label>
      <label><input type="checkbox" id="live-second"> I have read the limits above and explicitly confirm.</label>
      <div class="row">
        <button id="live-cancel">Cancel</button>
        <button id="live-confirm" class="danger">Confirm LIVE</button>
      </div>
      <div id="live-msg"></div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
