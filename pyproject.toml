[project]
name = "derivbot"
version = "1.0.0"
description = "Local, demo-first automated trading bot for the Deriv API with strict risk management"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "model", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "research", "scripts"]

# scikit-learn, joblib and scipy ship no complete type information; the untyped boundary is
# confined to app/ml/ (see docs/ML.md).
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
